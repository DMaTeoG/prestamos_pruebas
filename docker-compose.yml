services:
  db:
    image: postgres:16-alpine
    container_name: prestamos_db
    environment:
      POSTGRES_DB: ${DB_NAME:-scoring}
      POSTGRES_USER: ${DB_USER:-scoring}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scoring_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scoring} -d ${DB_NAME:-scoring}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.0
    container_name: prestamos_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init_localstack.py:/etc/localstack/init/ready.d/init_aws.py
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: prestamos-backend:${APP_VERSION:-latest}
    container_name: prestamos_backend
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-scoring}
      DB_USER: ${DB_USER:-scoring}
      DB_PASSWORD: ${DB_PASSWORD:-scoring_password}
      DB_HOST: db
      DB_PORT: 5432
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MODEL_ARTIFACT_DIR: /app/ml/artifacts/
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Entorno aislado de pruebas QA (Semana 4): Ejecución inmutable y retorno de Exit Code 0
  test:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: prestamos_qa_runner
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: test-secret-key-qa-isolation
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,test
      DB_NAME: ${DB_NAME:-scoring}
      DB_USER: ${DB_USER:-scoring}
      DB_PASSWORD: ${DB_PASSWORD:-scoring_password}
      DB_HOST: db
      DB_PORT: 5432
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      MODEL_ARTIFACT_DIR: /app/ml/artifacts/
    command: ["pytest", "--nomigrations", "--cov=apps", "--cov-report=term-missing", "--cov-fail-under=80"]

  locust:
    image: locustio/locust:2.32.4
    container_name: prestamos_locust
    profiles: ["perf"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8089:8089"
    volumes:
      - ./tests/performance:/mnt/locust
    environment:
      LOCUST_HOST: http://backend:8000
      PERF_USER_EMAIL: ${PERF_USER_EMAIL:-analyst@example.com}
      PERF_USER_PASSWORD: ${PERF_USER_PASSWORD:-AnalystPass123!}
    command: -f /mnt/locust/locustfile.py --host http://backend:8000

volumes:
  postgres_data:
  localstack_data:
