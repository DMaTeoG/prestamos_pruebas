name: CI - Quality & Docker Compose Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 (for fast linting)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install --only-binary :all: ruff || pip install ruff

      - name: Run Ruff static linting
        working-directory: backend
        run: ruff check .

      - name: Build & Run Tests in Isolated QA Container with Docker Compose
        run: |
          echo "=== [CI] Building and executing tests in isolated container ==="
          docker compose build test
          docker compose run --rm test

      - name: Tear down Docker Compose environment
        if: always()
        run: docker compose down -v

      - name: Notify Telegram (CI result)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "SUCCESS" || echo "FAILED")
          python scripts/notify_telegram.py \
            --title "CI Pipeline (Docker Compose QA Tests)" \
            --status "$STATUS" \
            --version "${GITHUB_SHA::7}" \
            --details "Branch: ${{ github.ref_name }} | Exit Code 0 verified in isolated Docker environment"
