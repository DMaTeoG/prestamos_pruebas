# Configuración de SonarCloud
sonar.projectKey=DMaTeoG_prestamos_pruebas
sonar.organization=dmateog

sonar.sources=backend
sonar.tests=backend
sonar.inclusions=backend/apps/**,backend/config/**
sonar.test.inclusions=backend/**/tests/**,backend/**/test_*.py
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/staticfiles/**,ml/**,backend/build.sh,scripts/**,docker/**,.github/**
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/**
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=docker/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
