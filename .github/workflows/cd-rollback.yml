name: CD - Staging Smoke Tests, Production Deploy & Automated Rollback

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simular fallo post-despliegue (HTTP 500) para auditar Rollback automático"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [main, master]

jobs:
  # ============================================================================
  # Fase 1: Despliegue en STAGING + Validaciones automáticas (Smoke Tests)
  # ============================================================================
  staging-verify:
    name: Staging Deployment & Smoke Testing
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CD & Performance dependencies
        run: pip install -r tests/performance/requirements.txt

      - name: Deploy to Staging Environment
        env:
          APP_VERSION: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/deploy.py \
            --stage staging \
            --version "${GITHUB_SHA::7}" \
            --health-url "http://localhost:8000/api/v1/health/"

      - name: Run Automated Smoke Tests in Staging (Locust)
        run: |
          mkdir -p reports
          locust -f tests/performance/locust_smoke.py \
            --headless \
            --users 5 \
            --spawn-rate 1 \
            --run-time 15s \
            --host http://localhost:8000 \
            --csv reports/locust_staging_smoke \
            --html reports/locust_staging_smoke.html

      - name: Upload Staging Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-staging-smoke-report
          path: reports/

      - name: Teardown Staging containers
        if: always()
        run: docker compose down -v

  # ============================================================================
  # Fase 2: Despliegue en PRODUCCIÓN con Rollback Automático ante fallos
  # ============================================================================
  production-deploy:
    name: Production Continuous Deployment
    needs: staging-verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tests/performance/requirements.txt

      - name: Deploy to Production with Automatic Rollback (deploy.py)
        env:
          APP_VERSION: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/deploy.py \
            --stage prod \
            --version "${GITHUB_SHA::7}" \
            --health-url "http://localhost:8000/api/v1/health/"

      - name: Audit Rollback Mechanism (Triggered if simulate_failure=true)
        if: ${{ github.event.inputs.simulate_failure == 'true' }}
        env:
          APP_VERSION: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Simulando fallo HTTP 500 para verificar ejecución del Rollback automático..."
          python scripts/deploy.py \
            --stage prod \
            --version "${GITHUB_SHA::7}-faulty" \
            --simulate-failure || echo "Rollback automático ejecutado satisfactoriamente."

      - name: Teardown Production containers
        if: always()
        run: docker compose down -v
