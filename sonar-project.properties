# Configuración de SonarCloud
sonar.projectKey=DMaTeoG_prestamos_pruebas
sonar.organization=dmateog

sonar.sources=backend/apps,backend/config
sonar.tests=backend/apps
sonar.test.inclusions=**/tests/**,**/test_*.py
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/staticfiles/**,ml/**,backend/build.sh,scripts/**,docker/**,.github/**
sonar.global.exclusions=docker/**,.github/**,scripts/**,backend/build.sh

# Reglas de exclusión multicriterio para ignorar reglas de pip/setup en CI y Docker
sonar.issue.ignore.multicriteria=m1,m2,m3,m4
sonar.issue.ignore.multicriteria.m1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.m1.resourceKey=.github/**
sonar.issue.ignore.multicriteria.m2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.m2.resourceKey=.github/**
sonar.issue.ignore.multicriteria.m3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.m3.resourceKey=docker/**
sonar.issue.ignore.multicriteria.m4.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.m4.resourceKey=docker/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
