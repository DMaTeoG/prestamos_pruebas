name: SonarCloud Static Code Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sonarcloud-analysis:
    name: SonarCloud Quality Gate Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies for test coverage
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with coverage XML for SonarCloud
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: pytest --cov=apps --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4

      - name: Notify Telegram (SonarCloud Status)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "SUCCESS" || echo "FAILED")
          python scripts/notify_telegram.py \
            --title "SonarCloud Static Analysis" \
            --status "$STATUS" \
            --version "${GITHUB_SHA::7}" \
            --details "Branch: ${{ github.ref_name }} | Quality Gate & Vulnerability Scan"

