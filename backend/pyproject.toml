[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "ml"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["ALL"]
"**/tests/*" = ["E501"]
"config/settings/*" = ["F403", "F405"]
